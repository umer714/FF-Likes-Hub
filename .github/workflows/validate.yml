name: Mindora validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Check backend JavaScript syntax
        run: |
          for file in api/*.js lib/*.js; do
            [ -f "$file" ] && node --check "$file"
          done
      - name: Validate Mindora app structure and inline JavaScript
        run: node scripts/validate.mjs
